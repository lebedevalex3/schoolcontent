assessment_items:
  - id: homework-3
    title: Решаем алгебраическое ядро
    source_ref: homework-content.tex#homeworktask-3
    statement_latex: |
      Решите неравенство
      \[
        y^4-y^2-12\ge0.
      \]
      Введите \(t=y^2\). Укажите ограничение на \(t\), которое следует из замены,
      и запишите множество решений относительно \(y\).
    rubric_profile: logineq-homework-3-v1
    expected_answers:
      - id: final-answer
        type: interval_set
        variable: y
        latex: '(-\infty;-2]\cup[2;+\infty)'
        intervals:
          - left: '-infinity'
            left_closed: false
            right: '-2'
            right_closed: true
          - left: '2'
            left_closed: true
            right: infinity
            right_closed: false

  - id: homework-4
    title: Решаем два неравенства с модулем
    source_ref: homework-content.tex#homeworktask-4
    statement_latex: |
      Решите два неравенства и для каждого запишите множество решений:
      \[
        \text{а) }0<|x-2|\le3,
        \qquad
        \text{б) }0<|x^2-4|\le1.
      \]
    rubric_profile: logineq-homework-4-v1
    expected_answers:
      - id: part-a
        type: interval_set
        variable: x
        latex: '[-1;2)\cup(2;5]'
        intervals:
          - left: '-1'
            left_closed: true
            right: '2'
            right_closed: false
          - left: '2'
            left_closed: false
            right: '5'
            right_closed: true
      - id: part-b
        type: interval_set
        variable: x
        latex: '[-\sqrt{5};-2)\cup(-2;-\sqrt{3}]\cup[\sqrt{3};2)\cup(2;\sqrt{5}]'
        intervals:
          - left: '-sqrt(5)'
            left_closed: true
            right: '-2'
            right_closed: false
          - left: '-2'
            left_closed: false
            right: '-sqrt(3)'
            right_closed: true
          - left: 'sqrt(3)'
            left_closed: true
            right: '2'
            right_closed: false
          - left: '2'
            left_closed: false
            right: 'sqrt(5)'
            right_closed: true

