    title: Собираем решение с опорой
    source_ref: homework-content.tex#homeworktask-5
    statement_latex: |
      Решите неравенство:
      \[
        \log_2^4((x-1)^2)-\log_2^2((x-1)^4)\ge192.
      \]
      Запишите ОДЗ, ход решения и точный ответ.
    rubric_profile: logineq-homework-5-v1
    expected_answers:
      - id: final-answer
        type: interval_set
        variable: x
        latex: '(-\infty;-3]\cup[\frac{3}{4};1)\cup(1;\frac{5}{4}]\cup[5;+\infty)'
        intervals:
          - left: '-infinity'
            left_closed: false
            right: '-3'
            right_closed: true
          - left: '3/4'
            left_closed: true
            right: '1'
            right_closed: false
          - left: '1'
            left_closed: false
            right: '5/4'
            right_closed: true
          - left: '5'
            left_closed: true
            right: infinity
            right_closed: false

